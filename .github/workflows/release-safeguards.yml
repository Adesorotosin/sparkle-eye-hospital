name: Release safeguards

on:
  pull_request:
    branches: [main, audit/doctor-module-hardening]
  push:
    branches: [fix/inventory-paid-prescription-guard]

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  pharmacy-database-safeguards:
    name: Pharmacy database integration tests (isolated PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sparkle_eye_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sparkle_eye_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sparkle_eye_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create Supabase role names for isolated schema test
        run: psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;"
      - name: Apply fresh-project schema to isolated database
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: Run transactional pharmacy safeguards tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/pharmacy_dispensing_safeguards.sql

  migration-upgrade-test:
    name: Existing-database migration upgrade test (isolated PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sparkle_eye_upgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sparkle_eye_upgrade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sparkle_eye_upgrade_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create Supabase role names for isolated schema test
        run: psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;"
      - name: Load current main-branch schema as the upgrade baseline
        run: |
          git fetch origin main
          git show origin/main:supabase/schema.sql > /tmp/base-schema.sql
          # The current main schema has legacy PL/pgSQL bodies closed with a single
          # dollar sign. Repair only the disposable CI copy so upgrade tests can
          # exercise the release migrations; the PR's fresh schema is fixed separately.
          sed -i -E 's/^([[:space:]]*AS) \$[[:space:]]*$/\1 $ /; s/^[[:space:]]*\$;[[:space:]]*$/$$;/' /tmp/base-schema.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/base-schema.sql
      - name: Apply release migrations in order
        run: |
          for migration in \
            supabase/migrations/20261015070000_add_pharmacy_review_statuses.sql \
            supabase/migrations/20261015080000_add_treatment_billing_requests.sql \
            supabase/migrations/20261015100000_harden_nurse_vitals_recording.sql \
            supabase/migrations/20261016100000_restore_doctor_proforma_and_handoffs.sql \
            supabase/migrations/20261016120000_fix_triage_doctor_queue_handoff.sql \
            supabase/migrations/20261016130000_allow_waiting_doctor_patient_status.sql \
            supabase/migrations/20261016140000_add_consultation_proforma_fields.sql \
            supabase/migrations/20261016150000_shared_inventory_module.sql \
            supabase/migrations/20261016160000_add_inventory_manager_role.sql \
            supabase/migrations/20261016170000_lock_down_inventory_table_access.sql \
            supabase/migrations/20261016180000_track_pharmacy_dispensing_in_inventory_ledger.sql \
            supabase/migrations/20261016190000_require_paid_invoice_before_pharmacy_dispensing.sql
          do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run transactional pharmacy safeguards tests after upgrade
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/pharmacy_dispensing_safeguards.sql
