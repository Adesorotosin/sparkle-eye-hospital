name: Release safeguards

on:
  pull_request:
    branches: [main, audit/doctor-module-hardening]
  push:
    branches: [fix/inventory-paid-prescription-guard]

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  pharmacy-database-safeguards:
    name: Pharmacy database integration tests (isolated PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sparkle_eye_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sparkle_eye_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sparkle_eye_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create Supabase role names for isolated schema test
        run: psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;"
      - name: Apply fresh-project schema to isolated database
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: Run transactional pharmacy safeguards tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/pharmacy_dispensing_safeguards.sql
