name: Hybrid RBAC checks

on:
  push:
    branches: [feat/hybrid-role-based-access]
  pull_request:
    branches: [feat/multi-doctor-patient-access, main]

jobs:
  typecheck-and-rbac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: RBAC permission resolution tests
        run: npm run test:rbac
      - name: Lint
        run: npm run lint
        continue-on-error: true
